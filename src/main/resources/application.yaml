spring:
  application:
    name: backend_mart

  config:
    import:
    - optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  api:
    base-path: ${API_BASE_PATH:/api/v1}
  pagination:
    default-page-size: ${PAGE_DEFAULT_SIZE:20}
    max-page-size: ${PAGE_MAX_SIZE:100}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  audit:
    enabled: ${AUDIT_ENABLED:true}